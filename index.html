<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matthew98</title>
    <!-- Import 98.css from unpkg -->
    <link rel="stylesheet" href="https://unpkg.com/98.css" />
    <!-- Link to custom styles -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="desktop">
        <!-- Desktop icons -->
        <div class="desktop-icon" id="recycle-icon" style="top: 0; left: 0;">
            <img src="assets/recycling.png" alt="Recycle Bin">
            <span>Recycle Bin</span>
        </div>
        <div class="desktop-icon" id="camera-icon" style="top: 0; left: 70px;">
            <img src="assets/camera.png" alt="Me">
            <span>Me</span>
        </div>
        <div class="desktop-icon" id="paint-icon" style="top: 70px; left: 0;">
            <img src="assets/paint.png" alt="MS Paint">
            <span>Greetings!</span>
        </div>
        <div class="desktop-icon" id="notepad-icon" style="top: 140px; left: 0;">
            <img src="assets/notepad.png" alt="Notepad">
            <span>About Me</span>
        </div>
        <div class="desktop-icon" id="ie-icon" style="top: 0; right: 0;">
            <div style="position: relative; width: 40px; height: 40px; margin-bottom: 2px;">
                <img src="assets/internet_explorer.png" alt="LinkedIn" style="margin: 0; position: absolute; top: 0; left: 0;">
                <img src="assets/shortcut.png" alt="Shortcut" style="position: absolute; top: 0; left: 0; width: 40px; height: 40px; margin: 0; z-index: 2; image-rendering: pixelated;">
            </div>
            <span>LinkedIn</span>
        </div>
        <div class="desktop-icon" id="github-icon" style="top: 70px; right: 0;">
            <div style="position: relative; width: 40px; height: 40px; margin-bottom: 2px;">
                <img src="assets/network_neighborhood.png" alt="GitHub" style="margin: 0; position: absolute; top: 0; left: 0;">
                <img src="assets/shortcut.png" alt="Shortcut" style="position: absolute; top: 0; left: 0; width: 40px; height: 40px; margin: 0; z-index: 2; image-rendering: pixelated;">
            </div>
            <span>GitHub</span>
        </div>
        <div class="desktop-icon" id="display-icon" style="bottom: 110px; right: 0;">
            <img src="assets/display.png" alt="Display">
            <span>My Eyes! They Burn!</span>
        </div>
        <div class="desktop-icon" id="freeram-icon" style="bottom: 40px; right: 0;">
            <img src="assets/agent.png" alt="FREE_RAM.exe">
            <span>FREE_RAM.exe</span>
        </div>
        
        <!-- Paint Window -->
        <div class="window draggable-window" style="width: 600px; height: 800px; position: absolute; top: 50px; left: 200px; display: flex; flex-direction: column;" id="blank-window">
            <div class="resize-handle n"></div>
            <div class="resize-handle s"></div>
            <div class="resize-handle e"></div>
            <div class="resize-handle w"></div>
            <div class="resize-handle ne"></div>
            <div class="resize-handle nw"></div>
            <div class="resize-handle se"></div>
            <div class="resize-handle sw"></div>
            <div class="title-bar">
                <div class="title-bar-text"><img src="assets/paint.png" alt="" style="width: 14px; height: 14px; margin-right: 4px; vertical-align: middle; image-rendering: pixelated;">Greetings!</div>
                <div class="title-bar-controls">
                    <button aria-label="Minimize"></button>
                    <button aria-label="Maximize"></button>
                    <button aria-label="Close"></button>
                </div>
            </div>
            <div class="window-body" style="flex: 1; margin: 0; display: flex; flex-direction: column; background-color: #c0c0c0; border: none; box-shadow: none; min-height: 0; min-width: 0; overflow: hidden;">
                <!-- Menu Bar -->
                <div class="menu-bar">
                    <span>File</span><span>Edit</span><span>View</span><span>Image</span><span>Colors</span><span>Help</span>
                </div>

                <!-- Main Workspace -->
                <div class="workspace" style="display: flex; flex: 1; overflow: hidden; padding-top: 2px; min-height: 0; min-width: 0;">
                    <!-- Toolbar (Left) -->
                    <div class="toolbar" style="width: 54px; padding: 2px; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 0;">
                        <!-- 16 standard MS paint tools -->
                        <button class="tool-btn disabled" title="Free-Form Select"><div class="icon" style="background-position: 0px 0px;"></div></button>
                        <button class="tool-btn disabled" title="Select"><div class="icon" style="background-position: -16px 0px;"></div></button>
                        <button class="tool-btn" title="Eraser"><div class="icon" style="background-position: -32px 0px;"></div></button>
                        <button class="tool-btn" title="Fill"><div class="icon" style="background-position: -48px 0px;"></div></button>
                        <button class="tool-btn" title="Pick Color"><div class="icon" style="background-position: -64px 0px;"></div></button>
                        <button class="tool-btn disabled" title="Magnifier"><div class="icon" style="background-position: -80px 0px;"></div></button>
                        <button class="tool-btn" title="Pencil"><div class="icon" style="background-position: -96px 0px;"></div></button>
                        <button class="tool-btn" title="Brush"><div class="icon" style="background-position: -112px 0px;"></div></button>
                        <button class="tool-btn" title="Airbrush"><div class="icon" style="background-position: -128px 0px;"></div></button>
                        <button class="tool-btn disabled" title="Text"><div class="icon" style="background-position: -144px 0px;"></div></button>
                        <button class="tool-btn disabled" title="Line"><div class="icon" style="background-position: -160px 0px;"></div></button>
                        <button class="tool-btn disabled" title="Curve"><div class="icon" style="background-position: -176px 0px;"></div></button>
                        <button class="tool-btn disabled" title="Rectangle"><div class="icon" style="background-position: -192px 0px;"></div></button>
                        <button class="tool-btn disabled" title="Polygon"><div class="icon" style="background-position: -208px 0px;"></div></button>
                        <button class="tool-btn disabled" title="Ellipse"><div class="icon" style="background-position: -224px 0px;"></div></button>
                        <button class="tool-btn disabled" title="Rounded Rectangle"><div class="icon" style="background-position: -240px 0px;"></div></button>
                        
                        <!-- Tool Options (size selectors for brush/eraser) -->
                        <div class="tool-options" id="tool-options" style="margin-top: 4px; height: 80px; width: 48px; background: #fff; border: 1px solid #808080; border-right-color: #fff; border-bottom-color: #fff; box-shadow: inset 1px 1px #0a0a0a; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; visibility: hidden;">
                            <div class="size-option" data-size="2" style="width: 8px; height: 8px; background: #000; border-radius: 50%;"></div>
                            <div class="size-option selected" data-size="5" style="width: 12px; height: 12px; background: #000; border-radius: 50%;"></div>
                            <div class="size-option" data-size="8" style="width: 16px; height: 16px; background: #000; border-radius: 50%;"></div>
                            <div class="size-option" data-size="14" style="width: 20px; height: 20px; background: #000; border-radius: 50%;"></div>
                        </div>
                    </div>

                    <!-- Canvas Area -->
                    <div class="canvas-container" style="flex: 1; padding: 3px; background-color: #808080; overflow: auto; display: flex; min-height: 0; min-width: 0;">
                        <!-- The wrapper scales with flex: 1 to fill space, providing the classic canvas feel -->
                        <div class="canvas-wrapper" style="background-color: #fff; border: 1px solid #000; box-shadow: 1px 1px #fff; flex: 1; position: relative; min-height: 0; min-width: 0; overflow: hidden;">
                            <canvas id="paint-canvas" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block;"></canvas>
                        </div>
                    </div>
                </div>

                <!-- Color Palette (Bottom) -->
                <div class="color-palette" style="height: 46px; padding: 4px 2px; display: flex; border-top: 1px solid #dfdfdf;">
                    <div class="current-colors" style="width: 32px; height: 32px; border: 1px solid #808080; border-right-color: #fff; border-bottom-color: #fff; box-shadow: inset 1px 1px #0a0a0a; position: relative; margin-right: 4px; background: #c0c0c0;">
                        <div class="color secondary" style="width: 14px; height: 14px; background-color: white; border: 1px solid #808080; border-right-color: #fff; border-bottom-color: #fff; position: absolute; bottom: 3px; right: 3px; z-index: 1; box-shadow: inset 1px 1px #0a0a0a;"></div>
                        <div class="color primary" style="width: 14px; height: 14px; background-color: black; border: 1px solid #808080; border-right-color: #fff; border-bottom-color: #fff; position: absolute; top: 3px; left: 3px; z-index: 2; box-shadow: inset 1px 1px #0a0a0a;"></div>
                    </div>
                    <div class="color-grid" style="display: grid; grid-template-columns: repeat(14, 15px); grid-template-rows: 15px 15px; gap: 0;">
                        <!-- Top Row -->
                        <div class="color-swatch" style="background-color: #000000;"></div><div class="color-swatch" style="background-color: #808080;"></div>
                        <div class="color-swatch" style="background-color: #800000;"></div><div class="color-swatch" style="background-color: #808000;"></div>
                        <div class="color-swatch" style="background-color: #008000;"></div><div class="color-swatch" style="background-color: #008080;"></div>
                        <div class="color-swatch" style="background-color: #000080;"></div><div class="color-swatch" style="background-color: #800080;"></div>
                        <div class="color-swatch" style="background-color: #808040;"></div><div class="color-swatch" style="background-color: #004040;"></div>
                        <div class="color-swatch" style="background-color: #0080FF;"></div><div class="color-swatch" style="background-color: #004080;"></div>
                        <div class="color-swatch" style="background-color: #8000FF;"></div><div class="color-swatch" style="background-color: #804000;"></div>
                        <!-- Bottom Row -->
                        <div class="color-swatch" style="background-color: #FFFFFF;"></div><div class="color-swatch" style="background-color: #C0C0C0;"></div>
                        <div class="color-swatch" style="background-color: #FF0000;"></div><div class="color-swatch" style="background-color: #FFFF00;"></div>
                        <div class="color-swatch" style="background-color: #00FF00;"></div><div class="color-swatch" style="background-color: #00FFFF;"></div>
                        <div class="color-swatch" style="background-color: #0000FF;"></div><div class="color-swatch" style="background-color: #FF00FF;"></div>
                        <div class="color-swatch" style="background-color: #FFFF80;"></div><div class="color-swatch" style="background-color: #00FF80;"></div>
                        <div class="color-swatch" style="background-color: #80FFFF;"></div><div class="color-swatch" style="background-color: #8080FF;"></div>
                        <div class="color-swatch" style="background-color: #FF0080;"></div><div class="color-swatch" style="background-color: #FF8040;"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Notepad Window -->
        <div class="window draggable-window" style="width: 500px; height: 500px; position: absolute; top: 80px; left: 250px; display: none; flex-direction: column;" id="notepad-window">
            <div class="resize-handle n"></div>
            <div class="resize-handle s"></div>
            <div class="resize-handle e"></div>
            <div class="resize-handle w"></div>
            <div class="resize-handle ne"></div>
            <div class="resize-handle nw"></div>
            <div class="resize-handle se"></div>
            <div class="resize-handle sw"></div>
            <div class="title-bar">
                <div class="title-bar-text"><img src="assets/notepad.png" alt="" style="width: 14px; height: 14px; margin-right: 4px; vertical-align: middle; image-rendering: pixelated;">About Me - Notepad</div>
                <div class="title-bar-controls">
                    <button aria-label="Minimize"></button>
                    <button aria-label="Maximize"></button>
                    <button aria-label="Close"></button>
                </div>
            </div>
            <div class="window-body" style="flex: 1; margin: 0; display: flex; flex-direction: column; background-color: #c0c0c0; border: none; box-shadow: none; min-height: 0; min-width: 0; overflow: hidden;">
                <!-- Menu Bar -->
                <div class="menu-bar">
                    <span>File</span><span>Edit</span><span>Search</span><span>Help</span>
                </div>
                <!-- Text Area -->
                <div style="flex: 1; padding: 0; display: flex; min-height: 0; min-width: 0;">
                    <textarea id="notepad-textarea" style="flex: 1; border: none; outline: none; resize: none; padding: 4px; font-family: 'Fixedsys', 'Courier New', monospace; font-size: 13px; line-height: 1.3; background: #fff; box-shadow: inset -1px -1px #fff, inset 1px 1px #808080, inset -2px -2px #dfdfdf, inset 2px 2px #0a0a0a; margin: 2px;">
Hi, I'm Matthew.

I'm a first year computer engineering student at the University of Waterloo.

I enjoy programming and I'm learning more about software development every day. I also love tinkering with hardware/firmware and understanding how things work. Let me know if you want to win some hackathons together!

Between the ECE lecture grind and everything else, I love digital art and music.

If you wanna reach out:
Email: matthewwangwty@gmail.com
Phone: 647-639-7334
</textarea>
                </div>
            </div>
        </div>

        <!-- Me Window -->
        <div class="window draggable-window" style="width: 400px; height: 400px; position: absolute; top: 120px; left: 300px; display: none; flex-direction: column;" id="me-window">
            <div class="resize-handle n"></div>
            <div class="resize-handle s"></div>
            <div class="resize-handle e"></div>
            <div class="resize-handle w"></div>
            <div class="resize-handle ne"></div>
            <div class="resize-handle nw"></div>
            <div class="resize-handle se"></div>
            <div class="resize-handle sw"></div>
            <div class="title-bar">
                <div class="title-bar-text"><img src="assets/camera.png" alt="" style="width: 14px; height: 14px; margin-right: 4px; vertical-align: middle; image-rendering: pixelated;">Me.</div>
                <div class="title-bar-controls">
                    <button aria-label="Minimize"></button>
                    <button aria-label="Maximize"></button>
                    <button aria-label="Close"></button>
                </div>
            </div>
            <div class="window-body" style="flex: 1; margin: 0; display: flex; align-items: center; justify-content: center; background-color: #c0c0c0; border: none; box-shadow: none; min-height: 0; min-width: 0; overflow: hidden; padding: 2px;">
                <div style="width: 100%; height: 100%; box-shadow: inset -1px -1px #fff, inset 1px 1px #808080, inset -2px -2px #dfdfdf, inset 2px 2px #0a0a0a; display: flex; align-items: center; justify-content: center; background-color: #fff; overflow: hidden;">
                    <img src="assets/placeholder.png" alt="Me" style="max-width: 100%; max-height: 100%;">
                </div>
            </div>
        </div>

        <!-- Taskbar -->
        <div class="taskbar">
            <button class="start-button">
                <img src="https://win98icons.alexmeub.com/icons/png/windows_slanted-1.png" alt="Start" style="width: 16px; height: 16px; margin-right: 4px;">
                Start
            </button>
            <div class="taskbar-divider"></div>
            <!-- Dynamic app buttons container -->
            <div id="taskbar-apps" style="display: flex; align-items: center; gap: 2px; flex: 1; min-width: 0;"></div>
            
            <!-- Taskbar Tray / Credits -->
            <div style="margin-left: auto; display: flex; align-items: center; height: 100%;">
                <div class="taskbar-divider" style="margin-right: 4px;"></div>
                <div class="status-bar-field" style="box-shadow: inset -1px -1px #fff, inset 1px 1px #0a0a0a, inset -2px -2px #dfdfdf, inset 2px 2px #808080; padding: 2px 6px; display: flex; align-items: center; height: 18px; font-size: 11px;">
                    Made with ♡ by&nbsp;<a href="https://github.com/matthewwangwty/matthew98" target="_blank" style="color: blue; text-decoration: none;">Matthew Wang</a>
                </div>
            </div>
        </div>
    </div>
    <!-- Cursor outline for brush/eraser size preview -->
    <div id="cursor-outline"></div>

    <!-- CRT Scanlines Overlay -->
    <div id="scanlines-overlay" style="display: block; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-image: url('assets/scanlines.gif'); background-repeat: repeat; opacity: 0.2; pointer-events: none; z-index: 99999;"></div>

    <!-- Link to Javascript -->
    <script src="script.js"></script>
</body>
</html>
